<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Listado de Árboles</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments :: header"></div>
 
<div class="container mt-5">
<h1>Listado de Árboles</h1>
<a href="/arboles/nuevo" class="btn btn-primary mb-3">Agregar Árbol</a>
 
    <table class="table table-striped">
<thead>
<tr>
<th>ID</th>
<th>Nombre Común</th>
<th>Tipo de Flor</th>
<th>Dureza Madera</th>
<th>Altura Promedio</th>
<th>Edad Promedio</th>
<th>Estado</th>
<th>Imagen</th>
<th>Acciones</th>
</tr>
</thead>
<tbody>
<tr th:each="arbol : ${arboles}">
<td th:text="${arbol.idArbol}"></td>
<td th:text="${arbol.nombreComun}"></td>
<td th:text="${arbol.tipoFlor}"></td>
<td th:text="${arbol.durezaMadera}"></td>
<td th:text="${arbol.alturaPromedio}"></td>
<td th:text="${arbol.edadPromedio}"></td>
<td th:text="${arbol.estado != null ? arbol.estado.nombreEstado : 'Sin Estado'}"></td>
<td>
<img th:if="${arbol.rutaImagen != null && arbol.rutaImagen != ''}" 
                         th:src="@{${arbol.rutaImagen}}" alt="Imagen" width="80">
</td>
<td>
<a th:href="@{'/arboles/editar/' + ${arbol.idArbol}}" class="btn btn-warning btn-sm">Editar</a>
<a th:href="@{'/arboles/eliminar/' + ${arbol.idArbol}}" class="btn btn-danger btn-sm">Eliminar</a>
</td>
</tr>
</tbody>
</table>
</div>
 
<div th:replace="fragments :: footer"></div>
</body>
</html>
