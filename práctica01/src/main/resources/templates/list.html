<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Listado de Árboles</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments :: header"></div>
 
    <div class="container mt-5">
<h1>Listado de Árboles</h1>
<a href="/arboles/nuevo" class="btn btn-primary mb-3">Agregar Árbol</a>
<table class="table table-striped">
<thead>
<tr>
<th>ID</th>
<th>Nombre Común</th>
<th>Tipo de Flor</th>
<th>Dureza Madera</th>
<th>Altura Promedio</th>
<th>Edad Promedio</th>
<th>Imagen</th>
<th>Acciones</th>
</tr>
</thead>
<tbody>
<tr th:each="arbol : ${arboles}">
<td th:text="${arbol.id_arbol}"></td>
<td th:text="${arbol.nombre_comun}"></td>
<td th:text="${arbol.tipo_flor}"></td>
<td th:text="${arbol.dureza_madera}"></td>
<td th:text="${arbol.altura_promedio}"></td>
<td th:text="${arbol.edad_promedio}"></td>
<td><img th:src="@{${arbol.ruta_imagen}}" alt="Imagen" width="80"></td>
<td>
<a th:href="@{'/arboles/editar/' + ${arbol.id_arbol}}" class="btn btn-warning btn-sm">Editar</a>
<a th:href="@{'/arboles/eliminar/' + ${arbol.id_arbol}}" class="btn btn-danger btn-sm">Eliminar</a>
</td>
</tr>
</tbody>
</table>
</div>
 
    <div th:replace="fragments :: footer"></div>
</body>
</html>
