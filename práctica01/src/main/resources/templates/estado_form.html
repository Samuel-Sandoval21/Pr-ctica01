<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Estado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments :: header"></div>

<div class="container mt-5">
    <h1 th:text="${estado.idEstado} != null ? 'Editar Estado' : 'Agregar Estado'"></h1>
    <form th:action="@{/estados/guardar}" th:object="${estado}" method="post">
        <div class="mb-3">
            <label>Nombre del Estado</label>
            <input type="text" th:field="*{nombreEstado}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/estados" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<div th:replace="fragments :: footer"></div>
</body>
</html>
