<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Formulario de Estado</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments :: header"></div>
 
<div class="container mt-5">
<h1 th:text="${estado.idEstado} != null ? 'Editar Estado' : 'Agregar Estado'"></h1>
<form th:action="@{/estados/guardar}" th:object="${estado}" method="post">
<div class="mb-3">
<label>Nombre del Estado</label>
<input type="text" th:field="*{nombreEstado}" class="form-control" required>
</div>
<button type="submit" class="btn btn-success">Guardar</button>
<a href="/estados" class="btn btn-secondary">Cancelar</a>
</form>
</div>
 
<div th:replace="fragments :: footer"></div>
</body>
</html>

 
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Listado de Estados</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments :: header"></div>
 
<div class="container mt-5">
<h1>Listado de Estados</h1>
<a href="/estados/nuevo" class="btn btn-primary mb-3">Agregar Estado</a>
 
    <table class="table table-striped">
<thead>
<tr>
<th>ID</th>
<th>Nombre del Estado</th>
<th>Acciones</th>
</tr>
</thead>
<tbody>
<tr th:each="estado : ${estados}">
<td th:text="${estado.idEstado}"></td>
<td th:text="${estado.nombreEstado}"></td>
<td>
<a th:href="@{'/estados/editar/' + ${estado.idEstado}}" class="btn btn-warning btn-sm">Editar</a>
<a th:href="@{'/estados/eliminar/' + ${estado.idEstado}}" class="btn btn-danger btn-sm">Eliminar</a>
</td>
</tr>
</tbody>
</table>
</div>
 
<div th:replace="fragments :: footer"></div>
</body>
</html>
