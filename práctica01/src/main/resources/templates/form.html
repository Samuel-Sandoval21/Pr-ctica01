<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Formulario de Árbol</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments :: header"></div>
 
    <div class="container mt-5">
<h1 th:text="${arbol.id_arbol} != null ? 'Editar Árbol' : 'Agregar Árbol'"></h1>
<form th:action="@{/arboles/guardar}" th:object="${arbol}" method="post" enctype="multipart/form-data">
<div class="mb-3">
<label>Nombre Común</label>
<input type="text" th:field="*{nombre_comun}" class="form-control" required>
</div>
<div class="mb-3">
<label>Tipo de Flor</label>
<input type="text" th:field="*{tipo_flor}" class="form-control" required>
</div>
<div class="mb-3">
<label>Dureza Madera</label>
<input type="text" th:field="*{dureza_madera}" class="form-control" required>
</div>
<div class="mb-3">
<label>Altura Promedio (m)</label>
<input type="number" th:field="*{altura_promedio}" class="form-control" required>
</div>
<div class="mb-3">
<label>Edad Promedio (años)</label>
<input type="number" th:field="*{edad_promedio}" class="form-control" required>
</div>
<div class="mb-3">
<label>Ruta de Imagen</label>
<input type="text" th:field="*{ruta_imagen}" class="form-control">
</div>
<button type="submit" class="btn btn-success">Guardar</button>
<a href="/arboles" class="btn btn-secondary">Cancelar</a>
</form>
</div>
 
    <div th:replace="fragments :: footer"></div>
</body>
</html>
