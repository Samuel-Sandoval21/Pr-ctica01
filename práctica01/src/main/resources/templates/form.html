<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Árbol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="fragments :: header"></div>

    <div class="container mt-5">
        <h1 th:text="${arbol.idArbol} != null ? 'Editar Árbol' : 'Agregar Árbol'"></h1>

        <form th:action="@{/arboles/guardar}" th:object="${arbol}" method="post">
            <div class="mb-3">
                <label>Nombre Común</label>
                <input type="text" th:field="*{nombreComun}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Tipo de Flor</label>
                <input type="text" th:field="*{tipoFlor}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Dureza Madera</label>
                <input type="text" th:field="*{durezaMadera}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Altura Promedio (m)</label>
                <input type="number" th:field="*{alturaPromedio}" class="form-control" step="0.01" required>
            </div>

            <div class="mb-3">
                <label>Edad Promedio (años)</label>
                <input type="number" th:field="*{edadPromedio}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Estado</label>
                <select th:field="*{estado.idEstado}" class="form-control" required>
                    <option value="">-- Seleccione un Estado --</option>
                    <option th:each="estado : ${estados}" 
                            th:value="${estado.idEstado}" 
                            th:text="${estado.nombreEstado}"
                            th:selected="${arbol.estado != null && arbol.estado.idEstado == estado.idEstado}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label>Ruta de Imagen</label>
                <input type="text" th:field="*{rutaImagen}" class="form-control" placeholder="ej: /uploads/arbol.jpg">
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="/arboles" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <div th:replace="fragments :: footer"></div>
</body>
</html>
