spring.application.name=Práctica01 Grupo#4

# Puerto del servidor

server.port=8081
 
# Datasource - Configuración con root

spring.datasource.url=jdbc:mysql://localhost:3306/practica?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=informatico19

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.liquibase.enabled=false
 
# Configuraciones adicionales para mejor conexión

spring.datasource.tomcat.test-on-borrow=true

spring.datasource.tomcat.validation-query=SELECT 1

spring.datasource.tomcat.max-active=10

spring.datasource.tomcat.max-idle=5

spring.datasource.tomcat.min-idle=2
 
# Logging: nivel TRACE y patrón de consola que incluye día del mes, hora y minuto

logging.level.root=TRACE

logging.level.com.practica01.demo=DEBUG
 
# Patrón de log para consola: [día] yyyy-MM-dd HH:mm:ss -> pero vamos a incluir día del mes explícito (dd)

logging.pattern.console=%d{dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
 
# Thymeleaf (configuración por si acaso)

spring.thymeleaf.prefix=classpath:/templates/

spring.thymeleaf.suffix=.html

spring.thymeleaf.mode=HTML

spring.thymeleaf.encoding=UTF-8

spring.thymeleaf.servlet.content-type=text/html

spring.thymeleaf.cache=false