# ----------------------
# NOMBRE DE LA APLICACIÓN
# ----------------------
spring.application.name=Práctica01 Grupo#4

# ----------------------
# PUERTO DEL SERVIDOR
# ----------------------
server.port=9001

# ----------------------
# DATOS DE CONEXIÓN A MYSQL
# ----------------------
spring.datasource.url=jdbc:mysql://localhost:3306/practica?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=usuario_practica
spring.datasource.password=la_Clave
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------
# JPA / HIBERNATE
# ----------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Forzar el dialecto para MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ----------------------
# LOGGING
# ----------------------
logging.level.root=TRACE
logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
