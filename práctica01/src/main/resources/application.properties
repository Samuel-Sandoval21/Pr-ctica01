# Nombre de la aplicación

spring.application.name=Práctica01 Grupo#4
 
# ----------------------

# PUERTO DEL SERVIDOR

# ----------------------

server.port=8090
 
# ----------------------

# DATOS DE CONEXIÓN A MYSQL

# ----------------------

spring.datasource.url=jdbc:mysql://localhost:3306/practica?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=la_clave
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# ----------------------

# JPA / HIBERNATE

# ----------------------

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
 
# ----------------------

# LOGGING: nivel TRACE y patrón de consola con día, mes, año, hora y minuto

# ----------------------

logging.level.root=TRACE

logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n