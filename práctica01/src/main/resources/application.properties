spring.application.name=Práctica01 Grupo#4
# Puerto del servidor
server.port=8090
 
# Datasource (ajusta host/usuario/clave si tu MySQL no está en localhost o usa otro puerto)
spring.datasource.url=jdbc:mysql://localhost:3306/practica?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=85116748
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# JPA / Hibernate (opcional: para desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
# Logging: nivel TRACE y patrón de consola que incluye día del mes, hora y minuto
logging.level.root=TRACE
 
# Patrón de log para consola: [día] yyyy-MM-dd HH:mm:ss -> pero vamos a incluir día del mes explícito (dd)
logging.pattern.console=%d{dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n